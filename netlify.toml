[build]
  command   = "npm run build"
  publish   = "dist"

# Proxy /saavn-api/* → saavn.sumit.co (replaces Vite dev proxy for production)
[[redirects]]
  from    = "/saavn-api/*"
  to      = "https://saavn.sumit.co/:splat"
  status  = 200
  force   = true

# The SPA fallback below is NOT needed for your multi-page structure.
# Removing it allows Netlify to serve each HTML file naturally.

