<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Spotify Clone</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-black-base text-white flex flex-col items-center justify-center h-screen">
    <div class="bg-black-secondary p-8 rounded-lg shadow-xl max-w-md w-full text-center">
        <h1 class="text-3xl font-bold mb-4">How can we help?</h1>
        <p class="text-secondary mb-6">Visit our forum or contact support for any issues regarding your music experience.</p>
        <button onclick="window.location.href='mailto:support@example.com'" class="bg-green text-black px-6 py-2 rounded-full font-bold hover:scale-105 transition mb-4 block w-full">Contact Support</button>
        <button onclick="window.history.back()" class="w-full text-secondary hover:text-white transition">Go Back</button>
    </div>
</body>
</html>
