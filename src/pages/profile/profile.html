<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Spotify Clone</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-black-base text-white flex flex-col items-center justify-center h-screen">
    <div class="bg-black-secondary p-8 rounded-lg shadow-xl text-center">
        <div class="w-32 h-32 bg-gray rounded-full mx-auto mb-4 flex items-center justify-center">
            <span class="material-symbols-outlined text-6xl">person</span>
        </div>
        <h1 class="text-4xl font-bold mb-2" id="profile-name">Loading...</h1>
        <p class="text-secondary mb-6">Spotify User</p>
        <button onclick="window.history.back()" class="bg-green text-black px-6 py-2 rounded-full font-bold hover:scale-105 transition">Go Back</button>
    </div>
    <script>
        const name = localStorage.getItem('DISPLAY_NAME') || 'User';
        document.getElementById('profile-name').innerText = name;
    </script>
</body>
</html>
